<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEKWORKS | Laptops & Mobile Phones</title>
  <link rel="icon" type="image/png" href="/assets/icon-t.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="index.html">TEK<span>WORKS.LK</span></a>
      <nav>
        <a href="#laptops">Laptops</a>
        <a href="#phones">Mobile Phones</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <p class="eyebrow">QUALITY • VALUE • TRUST</p>
        <h1>Good tech.<br>Fair prices.</h1>
        <p>Browse our available laptops and mobile phones. Contact us directly on WhatsApp for price and availability.</p>
      </div>
    </section>

    <div id="message" class="message"></div>

    <section id="laptops" class="product-section">
      <div class="section-heading">
        <h2>Laptops</h2>
        <span id="laptop-count"></span>
      </div>
      <div id="laptop-grid" class="product-grid"></div>
    </section>

    <section id="phones" class="product-section">
      <div class="section-heading">
        <h2>Mobile Phones</h2>
        <span id="phone-count"></span>
      </div>
      <div id="phone-grid" class="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <div class="logo">TEK<span>WORKS</span></div>
        <p>Used & brand-new laptops and mobile phones.</p>
      </div>
      <p>© 2026 TEKWORKS</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
